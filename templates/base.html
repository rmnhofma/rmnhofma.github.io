<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<meta name="description" content="{% block description %}{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
{% block meta %}{% endblock %}
<meta name="theme-color" content="#0a0e15">
<link rel="icon" type="image/svg+xml" href="{{ root }}assets/logo.svg">
<link rel="stylesheet" href="{{ root }}assets/site.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{ root or './' }}"><img src="{{ root }}assets/logo-mark.svg" alt="" width="26" height="25">PluginsBTW</a>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="site-footer">
  <span>PluginsBTW</span>
  <a href="https://github.com/{{ owner }}">github.com/{{ owner }}</a>
</footer>
</body>
</html>
